name: Deploy to cPanel (Iran)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# انتشار Release نیاز به مجوز نوشتن contents دارد
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # محیط توسعه با SQLite کار می‌کند؛ پروداکشن (هاست ایران) با PostgreSQL
      - name: Switch Prisma to PostgreSQL (production)
        run: |
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
          grep -n 'provider' prisma/schema.prisma

      - name: Prisma generate + Build (standalone bundle)
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: |
          bunx prisma generate
          bun run build
          test -f .next/standalone/server.js || { echo "standalone output missing"; exit 1; }
          test -d .next/standalone/.next/static || { echo "static assets missing"; exit 1; }
          test -d .next/standalone/public || { echo "public assets missing"; exit 1; }

      - name: Assemble deploy bundle
        run: |
          rm -rf bundle
          mkdir -p bundle/tmp
          cp -a .next/standalone/. bundle/
          date +%s > bundle/tmp/restart.txt
          tar -czf deploy-bundle.tar.gz -C bundle .
          echo "files: $(find bundle -type f | wc -l) | size: $(du -sh bundle | cut -f1) | tarball: $(du -sh deploy-bundle.tar.gz | cut -f1)"

      - name: Save bundle artifact (fallback for manual extract)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 7

      # فایروال/مسیر بین‌الملل هاست ایران، سشن FTP از گیت‌هاب را قطع می‌کند (timeout کنترل)
      # راه‌حل: معماری Pull — گیت‌هاب فقط Release منتشر می‌کند و کرون روی خود هاست،
      # باندل را از releases/latest/download می‌کشد (مسیر ایران←گیت‌هاب پایدار است)
      - name: Publish bundle to GitHub Releases (host pulls this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" deploy-bundle.tar.gz \
            --title "deploy ${GITHUB_SHA::7}" \
            --notes "auto build of $GITHUB_SHA" \
            --latest
          echo "published: https://github.com/vahidaskari1365/drpedrambakhshaei/releases/latest"

      - name: Smoke test (best-effort — foreign route to Iran is throttled)
        continue-on-error: true
        run: |
          sleep 15
          SRV_IP=$(getent hosts linux503.centraldnserver.com | awk '{print $1}' | head -1)
          echo "server ip: $SRV_IP"
          curl -sk -m 12 --resolve drpedrambakhshaei.com:443:$SRV_IP https://drpedrambakhshaei.com/ -o /dev/null -w "https via IP: %{http_code}\n" || true
          curl -s -m 12 --resolve drpedrambakhshaei.com:80:$SRV_IP http://drpedrambakhshaei.com/ -o /dev/null -w "http via IP: %{http_code}\n" || true
