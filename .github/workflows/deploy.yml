name: Deploy to cPanel (Iran)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# انتشار Release نیاز به مجوز نوشتن contents دارد
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # محیط توسعه با SQLite کار می‌کند؛ پروداکشن (هاست ایران) با PostgreSQL
      - name: Switch Prisma to PostgreSQL (production)
        run: |
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
          grep -n 'provider' prisma/schema.prisma

      - name: Prisma generate + Build (standalone bundle)
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: |
          bunx prisma generate
          bun run build
          test -f .next/standalone/server.js || { echo "standalone output missing"; exit 1; }
          test -d .next/standalone/.next/static || { echo "static assets missing"; exit 1; }
          test -d .next/standalone/public || { echo "public assets missing"; exit 1; }

      - name: Assemble split bundles (runtime base + app) and strip unused DB engines
        run: |
          rm -rf bundle
          mkdir -p bundle/tmp
          cp -a .next/standalone/. bundle/
          # tracing بیلد پوشه‌های غیرلازم ریپو را هم به standalone کشانده — حذف (تست بوت: همه صفحات 200)
          ( cd bundle && rm -rf src skills tool-results tests examples scripts docs .github db prisma .agent* *.md )
          date +%s > bundle/tmp/restart.txt
          # حذف موتورهای WASM دیتابیس‌های استفاده‌نشده (MySQL/SQLServer/Cockroach/...) — حدود ۵۵MB صرفه‌جویی
          find bundle/node_modules/@prisma/client/runtime -name "*wasm*" -delete || true
          test -f bundle/node_modules/.prisma/client/libquery_engine-*.so.node || { echo "query engine missing!"; exit 1; }
          RT_HASH=$( (cat bun.lock package.json prisma/schema.prisma; du -sb bundle/node_modules) | sha256sum | cut -c1-8 )
          RT_NAME="runtime-$RT_HASH.tar.gz"
          AP_NAME="app-$(date -u +%Y%m%d-%H%M%S).tar.gz"
          mkdir -p /tmp/rtsplit
          mv bundle/node_modules /tmp/rtsplit/node_modules
          tar -czf "$RT_NAME" -C /tmp/rtsplit node_modules
          tar -czf "$AP_NAME" -C bundle .
          printf 'runtime=%s\napp=%s\n' "$RT_NAME" "$AP_NAME" > manifest.txt
          echo "RT_NAME=$RT_NAME" >> "$GITHUB_ENV"
          echo "AP_NAME=$AP_NAME" >> "$GITHUB_ENV"
          echo "runtime: $RT_NAME ($(du -sh $RT_NAME | cut -f1)) | app: $AP_NAME ($(du -sh $AP_NAME | cut -f1))"

      - name: Save bundles artifact (fallback for manual extract)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundles
          path: |
            manifest.txt
            runtime-*.tar.gz
            app-*.tar.gz
          retention-days: 7

      # فایروال/مسیر بین‌الملل هاست ایران، سشن FTP از گیت‌هاب را قطع می‌کند (timeout کنترل)
      # راه‌حل: معماری Pull — گیت‌هاب فقط Release منتشر می‌کند و کرون روی خود هاست،
      # باندل را از releases/latest/download می‌کشد (مسیر ایران←گیت‌هاب پایدار است)
      # runtime فقط وقتی وابستگی‌ها عوض شوند روی هاست دانلود می‌شود؛ دیپلوی‌های معمولی فقط چند مگ app هستند
      - name: Publish bundles to GitHub Releases (host pulls these)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" manifest.txt "$RT_NAME" "$AP_NAME" \
            --title "deploy ${GITHUB_SHA::7}" \
            --notes "auto build of $GITHUB_SHA" \
            --latest
          echo "published: https://github.com/vahidaskari1365/drpedrambakhshaei/releases/latest"

      - name: Smoke test (best-effort — foreign route to Iran is throttled)
        continue-on-error: true
        run: |
          sleep 15
          SRV_IP=$(getent hosts linux503.centraldnserver.com | awk '{print $1}' | head -1)
          echo "server ip: $SRV_IP"
          curl -sk -m 12 --resolve drpedrambakhshaei.com:443:$SRV_IP https://drpedrambakhshaei.com/ -o /dev/null -w "https via IP: %{http_code}\n" || true
          curl -s -m 12 --resolve drpedrambakhshaei.com:80:$SRV_IP http://drpedrambakhshaei.com/ -o /dev/null -w "http via IP: %{http_code}\n" || true
