name: Deploy to cPanel (Iran)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # محیط توسعه با SQLite کار می‌کند؛ پروداکشن (هاست ایران) با PostgreSQL
      - name: Switch Prisma to PostgreSQL (production)
        run: |
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
          grep -n 'provider' prisma/schema.prisma

      - name: Prisma generate + Build (standalone bundle)
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: |
          bunx prisma generate
          bun run build
          test -f .next/standalone/server.js || { echo "standalone output missing"; exit 1; }
          test -d .next/standalone/.next/static || { echo "static assets missing"; exit 1; }
          test -d .next/standalone/public || { echo "public assets missing"; exit 1; }

      - name: Assemble deploy bundle
        run: |
          rm -rf bundle
          mkdir -p bundle/tmp
          cp -a .next/standalone/. bundle/
          date +%s > bundle/tmp/restart.txt
          tar -czf deploy-bundle.tar.gz -C bundle .
          echo "files: $(find bundle -type f | wc -l) | size: $(du -sh bundle | cut -f1) | tarball: $(du -sh deploy-bundle.tar.gz | cut -f1)"

      - name: Save bundle artifact (fallback for manual extract)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-bundle.tar.gz
          retention-days: 7

      # شبکه بین گیت‌هاب و هاست ایران نوسان دارد — ۳ بار تلاش با فاصله
      - name: Deploy via FTP (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          security: loose
          local-dir: bundle/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'drpedram-app/' }}
          state-name: ftp-state-1

      - name: Cooldown before retry
        if: steps.ftp1.outcome == 'failure'
        run: sleep 40

      - name: Deploy via FTP (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          security: loose
          local-dir: bundle/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'drpedram-app/' }}
          state-name: ftp-state-2

      - name: Cooldown before final retry
        if: steps.ftp2.outcome == 'failure'
        run: sleep 60

      - name: Deploy via FTP (attempt 3 - final)
        id: ftp3
        if: steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          security: loose
          local-dir: bundle/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'drpedram-app/' }}
          state-name: ftp-state-3

      - name: Smoke test after deploy (site liveness)
        continue-on-error: true
        run: |
          sleep 25
          SRV_IP=$(getent hosts ftp.drpedrambakhshaei.com | awk '{print $1}' | head -1)
          echo "server ip: $SRV_IP"
          echo "-- via domain:"; curl -sk -m 30 -o /dev/null -w "HTTP %{http_code}\n" https://drpedrambakhshaei.com/ || true
          echo "-- via server IP with Host header:"; curl -sk -m 30 -o /dev/null -w "HTTP %{http_code}\n" --resolve drpedrambakhshaei.com:443:$SRV_IP https://drpedrambakhshaei.com/ || true
          echo "-- plain HTTP via IP:"; curl -s -m 30 -o /dev/null -w "HTTP %{http_code}\n" --resolve drpedrambakhshaei.com:80:$SRV_IP http://drpedrambakhshaei.com/ || true
